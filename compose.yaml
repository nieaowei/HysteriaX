services:
  postgres:
    image: postgres:18-bookworm
    init: true
    stop_grace_period: 1m
    restart: unless-stopped
    environment:
      POSTGRES_DB: hysteriax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HYSTERIAX_DB_ADMIN_PASSWORD:?run scripts/init-secrets.sh first}
      HYSTERIAX_DB_USER: ${HYSTERIAX_DB_USER:-hysteriax}
      HYSTERIAX_DB_PASSWORD: ${HYSTERIAX_DB_PASSWORD:?run scripts/init-secrets.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/provision-postgres.sh:/docker-entrypoint-initdb.d/10-provision-hysteriax.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "exec pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      HYSTERIAX_REDIS_PASSWORD: ${HYSTERIAX_REDIS_PASSWORD:?run scripts/init-secrets.sh first}
    command: [sh, -ec, 'exec redis-server --requirepass "$$HYSTERIAX_REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$HYSTERIAX_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  api: &api-runtime
    build: .
    image: "${HYSTERIAX_IMAGE:-hysteriax-server}:${HYSTERIAX_VERSION:-dev}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: "${HYSTERIAX_UID:-1000}:${HYSTERIAX_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://${HYSTERIAX_DB_USER:-hysteriax}:${HYSTERIAX_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-hysteriax}
      HYSTERIAX_REDIS_URL: redis://:${HYSTERIAX_REDIS_PASSWORD}@redis:6379/0
      HYSTERIAX_LISTEN_ADDR: 0.0.0.0:8080
      HYSTERIAX_PUBLIC_URL: https://${HYSTERIAX_DOMAIN}
      HYSTERIAX_ADMIN_TOKEN: ${HYSTERIAX_ADMIN_TOKEN}
      HYSTERIAX_MASTER_KEY: ${HYSTERIAX_MASTER_KEY}
      HYSTERIAX_ASSET_CACHE_DIR: /var/cache/hysteriax/assets
      RUST_LOG: info
    volumes:
      - ./data/assets:/var/cache/hysteriax/assets
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    <<: *api-runtime
    profiles: [maintenance]
    restart: "no"
    command: ["--migrate-only"]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HYSTERIAX_DOMAIN: ${HYSTERIAX_DOMAIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
