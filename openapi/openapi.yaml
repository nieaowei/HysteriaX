openapi: 3.1.0
info:
  title: HysteriaX Management API
  version: 1.0.0
  description: Versioned API for the HysteriaX management service.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: localhost
security:
  - BearerAuth: []
paths:
  /credentials:
    get:
      operationId: listCredentials
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialSummary'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      responses:
        '201':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
  /credentials/{id}:
    get:
      operationId: getCredential
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetail'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCredential
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPatch'
    delete:
      operationId: deleteCredential
      parameters:
      - name: expected_revision
        in: query
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credentials/{id}/versions:
    post:
      operationId: publishCredentialVersion
      responses:
        '202':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPublish'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credentials/{id}/references:
    get:
      operationId: getCredentialReferences
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialReference'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credential-batches/{id}:
    get:
      operationId: getCredentialBatch
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBatch'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credential-batches/{id}/retry:
    post:
      operationId: retryCredentialBatch
      responses:
        '202':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBatchReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  "/overview":
    get:
      operationId: getOverview
      summary: Read full dashboard summary and actionable issues
      responses:
        '200':
          description: Monitoring overview
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OverviewResponse"
        '400':
          "$ref": "#/components/responses/Error"
  "/overview/history":
    get:
      operationId: getOverviewHistory
      summary: Read rolling monitoring history (24h, 7d, 30d; legacy today)
      responses:
        '200':
          description: Monitoring overview
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OverviewHistory"
        '400':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
      x-swift-include-optional-query: true
      parameters:
      - name: range
        description: Rolling elapsed time (24h, 7d, 30d), with hourly or 24-hour buckets anchored at window start. Legacy today uses local midnight.
        in: query
        required: true
        schema:
          type: string
          enum:
          - 24h
          - today
          - 7d
          - 30d
      - name: timezone
        in: query
        required: true
        schema:
          type: string
      - name: node_id
        in: query
        required: false
        schema:
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - users
          - network
  /nodes:
    get:
      operationId: listNodes
      summary: List nodes
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeSummary' }
    post:
      operationId: createNode
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCreate' }
      responses:
        '201':
          description: Created node and one-time node token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEntity' }
        '400': { $ref: '#/components/responses/Error' }
  /nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getNode
      summary: Get node
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateNode
      summary: Update node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePatch' }
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeUpdateResponse' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteNode
      summary: Delete node and queue managed remote uninstall
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Queued remote uninstall job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/record:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: removeNodeRecord
      summary: Remove only the management record without SSH or remote uninstall
      description: Removes node assignments, configuration and pending revocations, cancels queued and cancellable running jobs, and retains job history and audit. The remote service may remain running. Conflicts while a remote deployment, uninstall or credential update is running; wait for that operation to finish. Requires the node_record_removal feature.
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Management record removed; remote uninstall was not performed }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateNodeUsage
      summary: Correct or reset whole-host package usage without deploying the node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeUsageUpdate' }
      responses:
        '200':
          description: Updated usage and node revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeUsageUpdateResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/ssh-test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: testNodeSSH
      summary: Test node ssh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued SSH test job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/deploy:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: deployNode
      summary: Deploy node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued deployment job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: syncNode
      summary: Sync node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued synchronization job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/rollback:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rollbackNode
      summary: Rollback node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued rollback job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listNodeResources
      summary: List node resources
      responses:
        '200':
          description: Resource metadata without resource contents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeResource' }
    post:
      operationId: uploadNodeResource
      summary: Upload a node resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCreate' }
      responses:
        '201':
          description: Created encrypted resource and reference URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceReceipt' }
        '400': { $ref: '#/components/responses/Error' }
  /nodes/{id}/resources/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: resource_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteNodeResource
      summary: Delete an unreferenced node resource
      responses:
        '204': { description: Deleted resource }
        '409': { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }
    post:
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEntity' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUser
      summary: Get user
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
    patch:
      operationId: updateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserUpdateResponse' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteUser
      summary: Delete user
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted }
  /users/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: assignUserToNode
      summary: Assign user to node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRequest' }
      responses:
        '201':
          description: Assignment and one-time Hysteria credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}/assignments/{node_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: node_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unassignUserFromNode
      summary: Unassign user from node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200':
          description: Unassigned and kick queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentMutationResponse' }
    put:
      operationId: updateAssignmentClientCertificate
      summary: Update a user's per-node mTLS certificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCertificateUpdate' }
      responses:
        '200':
          description: Updated client certificate and queued client kick
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentMutationResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}/credentials/rotate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rotateUserCredentials
      summary: Rotate user credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200':
          description: "Rotated credentials, shown once"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotatedCredentials' }
  /users/{id}/subscription:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSubscription
      summary: Get subscription
      responses:
        '200':
          description: Current subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
    post:
      operationId: rotateSubscription
      summary: Rotate subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200':
          description: New subscription token and URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionReceipt' }
  /users/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUserUsage
      summary: Get user usage
      responses:
        '200':
          description: Aggregated usage and freshness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserUsageResponse' }
  /users/{id}/quota/reset:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetUserQuota
      summary: Reset user quota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200':
          description: Quota reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaResetResponse' }
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs
      responses:
        '200':
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobSummary' }
  /server/monitoring:
    get:
      operationId: getServerMonitoring
      summary: Get management service health and host resource snapshot
      responses:
        '200':
          description: Server monitoring (host resources as visible to the service; disk is root filesystem)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerMonitoring' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /version:
    get:
      operationId: getAPIVersion
      summary: Get API and pinned dependency versions
      responses:
        '200':
          description: Version compatibility information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIVersion' }
  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getJob
      summary: Get job
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetailResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: retryJob
      summary: Retry a failed job with an explicit link to its prior attempt
      description: Supports SSH test, deployment/sync, rollback and pending kick requests. Kick executions are bounded to five attempts; transport failures retain a durable request resumed after trusted SSH recovery, while other exhausted or permanent failures require explicit retry. Active duplicate requests return the same retry. Retry success resolves only the linked failure reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Linked retry queued or already active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /jobs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: streamJobEvents
      summary: Stream job events
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          description: Resume after the last event ID previously received.
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Resumable server-sent event stream
          content:
            text/event-stream: { schema: { type: string } }
  /events:
    get:
      operationId: streamEvents
      summary: Stream events
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          description: Resume after the last event ID previously received.
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resumable server-sent event stream
          content:
            text/event-stream: { schema: { type: string } }
  /audit:
    get:
      operationId: listAuditRecords
      summary: List audit records
      responses:
        '200':
          description: Recent audit records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditSummary' }
  /admin/tokens:
    get:
      operationId: listAdminTokens
      summary: List admin tokens
      responses:
        '200':
          description: Token metadata without token values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminTokenSummary' }
    post:
      operationId: createAdminToken
      summary: Create admin token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 100 }
      responses:
        '201':
          description: "New bearer token, shown once"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTokenReceipt' }
  /admin/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: revokeAdminToken
      summary: Revoke admin token
      responses:
        '204': { description: Revoked token }
  /healthz:
    get:
      summary: Check liveness
      operationId: healthCheck
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: Liveness check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIHealth' }
  /readyz:
    get:
      summary: Check readiness
      operationId: readinessCheck
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: Readiness check including database
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIHealth' }
  /openapi.yaml:
    get:
      summary: Download the OpenAPI contract
      operationId: getOpenAPISpec
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: OpenAPI document in YAML format
          content:
            application/yaml: { schema: { type: string } }
  /sub/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a negotiated subscription or the format selection page
      operationId: downloadAutomaticSubscription
      x-swift-include-optional-query: true
      description: |
        Explicit format overrides User-Agent. Auto recognizes Mihomo, sing-box,
        Shadowrocket, v2rayN and v2rayNG; unknown clients receive an HTML selection page.
        Advanced nodes are filtered when the client/version cannot preserve required features.
        All incompatible nodes produce 422; an unassigned user receives an empty subscription.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [auto, mihomo, singbox, base64, uri], default: auto }
        - name: User-Agent
          in: header
          description: Client kernel and version; unknown versions use conservative capabilities.
          schema: { type: string }
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: Subscription file or static format selection page
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string, const: User-Agent } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Robots-Tag: { schema: { type: string, const: 'noindex, nofollow' } }
            X-HysteriaX-Filtered-Nodes:
              description: Number of incompatible nodes omitted from a subscription file.
              schema: { type: integer, minimum: 0 }
          content:
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
            text/html: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sub/{token}/clash.yaml:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download Mihomo subscription
      operationId: downloadSubscription
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: Mihomo YAML configuration
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/yaml: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /hy2/auth/{node_id}/{node_token}:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: node_token
        in: path
        required: true
        schema: { type: string }
    post:
      security: []
      operationId: authenticateHysteriaUser
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      summary: Authenticate hysteria user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addr, auth, tx]
              properties:
                addr: { type: string }
                auth: { type: string }
                tx: { type: integer, format: int64 }
      responses:
        '200':
          description: Hysteria HTTP authentication result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HysteriaAuthResponse' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorResponse' }
  schemas:
    Revision:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
    AssignmentRequest:
      type: object
      required:
      - expected_revision
      - node_id
      properties:
        expected_revision:
          type: integer
          minimum: 1
        node_id:
          type: string
          format: uuid
        mtls_credential_id:
          type: string
        mtls_credential_version:
          type: integer
          minimum: 1
      additionalProperties: false
    AssignmentCertificateUpdate:
      allOf:
      - $ref: '#/components/schemas/Revision'
      - type: object
        required:
        - mtls_credential_id
        - mtls_credential_version
        properties:
          mtls_credential_id:
            type: string
          mtls_credential_version:
            type: integer
            minimum: 1
        additionalProperties: false
    NodePackage:
      type: object
      description: Complete package replacement on PATCH; omission preserves the package. Null expiry/quota removes that limit. Usage is changed only through the usage endpoint.
      required: [cycle, reset_day, timezone, direction, expiry_warning_days, traffic_warning_percent]
      properties:
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        cycle: { type: string, enum: [fixed, monthly] }
        reset_day: { type: integer, minimum: 1, maximum: 31 }
        timezone: { type: string, description: IANA timezone; default Asia/Shanghai. }
        interface: { type: [string, 'null'], description: Null selects the default-route interface automatically. }
        direction: { type: string, enum: [tx, rx, both] }
        expiry_warning_days: { type: integer, minimum: 0, maximum: 365 }
        traffic_warning_percent: { type: integer, minimum: 1, maximum: 99 }
    NodePackageUsage:
      type: object
      required: [usage_bytes, restricted, reasons, alerts, freshness]
      properties:
        usage_bytes: { type: integer, format: int64 }
        restricted: { type: boolean }
        reasons: { type: array, items: { type: string } }
        next_reset_at: { type: [string, 'null'], format: date-time }
        interface: { type: [string, 'null'] }
        sampled_at: { type: [string, 'null'], format: date-time }
        gap_reason: { type: [string, 'null'] }
        freshness: { type: string, enum: [fresh, stale, not_collected] }
        pending_disconnects: { type: integer }
        failed_disconnects: { type: integer }
        alerts: { type: array, items: { $ref: '#/components/schemas/NodeAlert' } }
    NodeAlert:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [expiring, expired, traffic_warning, quota_exhausted] }
        created_at: { type: string, format: date-time }
    NodeUsageUpdate:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [usage_bytes]
          properties:
            usage_bytes: { type: integer, format: int64, minimum: 0 }
            reset: { type: boolean, description: Start a new alert period; preserves the monthly billing schedule. }
    NodeUsageUpdateResponse:
      type: object
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer }
    NodeCreate:
      type: object
      required:
      - name
      - ssh_host
      - ssh_port
      - ssh_username
      - public_host
      - public_port
      - listen_addr
      - ssh_credential_id
      - ssh_credential_version
      properties:
        package:
          $ref: '#/components/schemas/NodePackage'
        initial_usage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Existing provider usage before first network sample.
        name:
          type: string
          maxLength: 100
        ssh_host:
          type: string
        ssh_port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_username:
          type: string
        ssh_host_fingerprint:
          type: string
        public_host:
          type: string
        public_port:
          type: integer
          minimum: 1
          maximum: 65535
        listen_addr:
          type: string
        traffic_stats_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9780
          description: Loopback-only Hysteria trafficStats API port
        proxy_probe_url:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Optional HTTP 200 health target used by the deployment-time proxy
            probe when routing rules block the built-in loopback target
        tls_sni:
          type: string
        tls_skip_verify:
          type: boolean
          default: false
        config:
          type: object
          additionalProperties: true
          default: {}
        ssh_credential_id:
          type: string
          format: uuid
        ssh_credential_version:
          type: integer
          minimum: 1
      additionalProperties: false
    NodePatch:
      allOf:
      - $ref: '#/components/schemas/Revision'
      - type: object
        properties:
          package:
            $ref: '#/components/schemas/NodePackage'
          name:
            type: string
          ssh_host:
            type: string
          ssh_port:
            type: integer
            minimum: 1
            maximum: 65535
          ssh_username:
            type: string
          ssh_host_fingerprint:
            type: string
          public_host:
            type: string
          public_port:
            type: integer
            minimum: 1
            maximum: 65535
          listen_addr:
            type: string
          traffic_stats_port:
            type: integer
            minimum: 1
            maximum: 65535
            description: Loopback-only Hysteria trafficStats API port
          proxy_probe_url:
            type: string
            maxLength: 2048
            description: HTTP 200 probe URL reachable through this node's ACL/outbound
              rules; use an empty string to restore the local statistics probe
          tls_sni:
            type: string
          tls_skip_verify:
            type: boolean
          config:
            type: object
            additionalProperties: true
          ssh_credential_id:
            type: string
            format: uuid
          ssh_credential_version:
            type: integer
            minimum: 1
        additionalProperties: false
    ResourceCreate:
      type: object
      required:
      - name
      - resource_kind
      - content_base64
      properties:
        name:
          type: string
          maxLength: 180
        resource_kind:
          type: string
          enum:
          - acl
          - geoip
          - geosite
        content_base64:
          type: string
          format: byte
          writeOnly: true
          description: Base64 encoded resource; decoded size is limited to 20 MiB
    UserCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
    UserPatch:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          properties:
            name: { type: string }
            enabled: { type: boolean }
            expires_at: { type: [string, 'null'], format: date-time }
            quota_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
    NodeSummary:
      type: object
      required: [id, name, revision, state]
      properties:
        package: { $ref: '#/components/schemas/NodePackage' }
        package_usage: { $ref: '#/components/schemas/NodePackageUsage' }
        id: { type: string, format: uuid }
        name: { type: string }
        ssh: { $ref: '#/components/schemas/NodeSSHDetail' }
        revision: { type: integer }
        deployed_revision: { type: [integer, 'null'] }
        state: { type: string }
        last_sample_at: { type: [string, 'null'], format: date-time }
        data_freshness: { type: string, enum: [fresh, stale, not_collected] }
        open_gaps: { type: integer }
        pending_revocations: { type: integer }
        proxy_probe_url: { type: [string, 'null'], maxLength: 2048 }
    NodeSSHDetail:
      type: object
      required:
      - host
      - port
      - username
      - auth_type
      - credential_id
      - credential_version
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        auth_type:
          type: string
        host_fingerprint:
          type:
          - string
          - 'null'
        credential_id:
          type: string
        credential_version:
          type: integer
    NodeConnectionDetail:
      type: object
      required: [host, port, listen_addr, skip_cert_verify]
      properties:
        host: { type: string }
        port: { type: integer }
        listen_addr: { type: string }
        tls_sni: { type: [string, 'null'] }
        skip_cert_verify: { type: boolean }
    NodeDetail:
      type: object
      required: [id, name, revision, config, yaml_preview, ssh, public, state, created_at, updated_at]
      properties:
        package: { $ref: '#/components/schemas/NodePackage' }
        package_usage: { $ref: '#/components/schemas/NodePackageUsage' }
        id: { type: string, format: uuid }
        name: { type: string }
        revision: { type: integer }
        deployed_revision: { type: [integer, 'null'] }
        config: { type: object, additionalProperties: true }
        yaml_preview: { type: string }
        ssh: { $ref: '#/components/schemas/NodeSSHDetail' }
        public: { $ref: '#/components/schemas/NodeConnectionDetail' }
        traffic_stats_port: { type: integer, minimum: 1, maximum: 65535, description: "Loopback-only Hysteria trafficStats API port" }
        state: { type: string }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_sample_at: { type: [string, 'null'], format: date-time }
        data_freshness: { type: string, enum: [fresh, stale, not_collected] }
        open_gaps: { type: integer }
        pending_revocations: { type: integer }
        proxy_probe_url: { type: [string, 'null'], maxLength: 2048 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssignmentInfo:
      type: object
      required:
      - node_id
      - created_at
      properties:
        node_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        mtls_credential_id:
          type:
          - string
          - 'null'
        mtls_credential_version:
          type:
          - integer
          - 'null'
    UserSummary:
      type: object
      required: [id, name, enabled, expires_at, quota_bytes, usage_bytes, revision, quota_reset_at, assignments, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64 }
        usage_bytes: { type: integer, format: int64 }
        revision: { type: integer }
        quota_reset_at: { type: [string, 'null'], format: date-time }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AssignmentInfo' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobOutcome:
      type: object
      properties:
        status: { type: string }
        fingerprint: { type: string }
        distribution: { type: string }
        version: { type: string }
        architecture: { type: string }
        privilege: { type: string }
        proxy_probe:
          type: [object, 'null']
          properties:
            status: { type: string }
            transport: { type: string }
            route_check: { type: string, enum: [tcp_forwarding, authenticated_session] }
          additionalProperties: true
      additionalProperties: true
    JobResult:
      type: object
      properties:
        stage: { type: string }
        result: { $ref: '#/components/schemas/JobOutcome' }
      additionalProperties: true
    JobSummary:
      type: object
      required: [id, kind, status, stage, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        node_id: { type: [string, 'null'], format: uuid }
        node_name:
          type: [string, 'null']
          description: Node name captured when the job was created; retained after node rename or deletion.
        retry_of_job_id: { type: [string, 'null'], description: Prior failed or unsuccessful retry attempt. }
        retry_job_id: { type: [string, 'null'], description: Direct retry attempt, when present. }
        target_revision: { type: [integer, 'null'] }
        status: { type: string }
        stage: { type: string }
        error_message: { type: [string, 'null'] }
        result: { $ref: '#/components/schemas/JobResult' }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    AuditSummary:
      type: object
      required: [id, actor, action, entity_type, entity_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        created_at: { type: string, format: date-time }
        detail: { type: object, additionalProperties: true }
    NodeResource:
      type: object
      required: [id, name, resource_kind, content_sha256, size_bytes, created_at, reference]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource_kind: { type: string }
        content_sha256: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        reference: { type: string }
    ResourceReceipt:
      type: object
      required: [id, reference, content_sha256]
      properties:
        id: { type: string, format: uuid }
        resource_kind: { type: string }
        content_sha256: { type: string }
        size_bytes: { type: integer, format: int64 }
        reference: { type: string }
    AssignmentReceipt:
      type: object
      required: [user_id, node_id, revision, hy2_credential, note]
      properties:
        user_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        revision: { type: integer }
        hy2_credential: { type: string, description: One-time Hysteria credential returned after assignment. }
        note: { type: string }
    AssignmentMutationResponse:
      type: object
      required: [user_id, node_id, revision]
      properties:
        user_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        revision: { type: integer }
    SubscriptionReceipt:
      type: object
      required: [user_id, revision, token, url, note]
      properties:
        user_id: { type: string, format: uuid }
        revision: { type: integer }
        token: { type: string, description: One-time subscription token returned on rotation. }
        url: { type: string }
        auto_url: { type: string, description: Automatic subscription URL; optional for compatibility with older servers. }
        note: { type: string }
    RotatedCredential:
      type: object
      required: [node_id, credential]
      properties:
        node_id: { type: string, format: uuid }
