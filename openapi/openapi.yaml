    get:
      operationId: getDNSBinding
      tags:
      - DNS
      summary: getDNSBinding
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBindingResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setDNSBinding
      tags:
      - DNS
      summary: setDNSBinding
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSActionReceipt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSBindingSet'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeDNSBinding
      tags:
      - DNS
      summary: removeDNSBinding
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSActionReceipt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSBindingRemove'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorResponse' }
  schemas:
    ClientSummary:
      type: object
      required: [node_count, user_total, user_enabled, user_expired, user_expiring, user_depleted, notification_nodes, notification_credentials]
      properties:
        node_count: { type: integer }
        user_total: { type: integer }
        user_enabled: { type: integer }
        user_expired: { type: integer }
        user_expiring: { type: integer }
        user_depleted: { type: integer }
        notification_nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeSummary' }
        notification_credentials:
          type: array
          items: { $ref: '#/components/schemas/CredentialSummary' }
    Revision:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
    AuthorizationPair:
      type: object
      required: [user_id, node_id]
      properties:
        user_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
    AuthorizationGroupPreview:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [create, update, delete] }
        expected_revision: { type: integer, minimum: 1 }
        name: { type: string }
        user_ids:
          type: array
          items: { type: string, format: uuid }
        node_ids:
          type: array
          items: { type: string, format: uuid }
      additionalProperties: false
    AuthorizationGroupCreate:
      type: object
      required: [name, user_ids, node_ids, preview_token]
      properties:
        name: { type: string }
        user_ids:
          type: array
          items: { type: string, format: uuid }
        node_ids:
          type: array
          items: { type: string, format: uuid }
        preview_token: { type: string }
      additionalProperties: false
    AuthorizationGroupUpdate:
      type: object
      required: [expected_revision, name, user_ids, node_ids, preview_token]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        name: { type: string }
        user_ids:
          type: array
          items: { type: string, format: uuid }
        node_ids:
          type: array
          items: { type: string, format: uuid }
        preview_token: { type: string }
      additionalProperties: false
    AuthorizationGroupDelete:
      type: object
      required: [expected_revision, preview_token]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        preview_token: { type: string }
      additionalProperties: false
    UserAuthorizationGroupsPreview:
      type: object
      required: [expected_revision, group_ids]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        group_ids:
          type: array
          items: { type: string }
      additionalProperties: false
    UserAuthorizationGroupsUpdate:
      type: object
      required: [expected_revision, preview_token, group_ids]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        preview_token: { type: string }
        group_ids:
          type: array
          items: { type: string }
      additionalProperties: false
    NodePackage:
      type: object
      description: Complete package replacement on PATCH; omission preserves the package. Null expiry/quota removes that limit. Usage is changed only through the usage endpoint.
      required: [cycle, reset_day, timezone, direction, expiry_warning_days, traffic_warning_percent]
      properties:
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        cycle: { type: string, enum: [fixed, monthly] }
        reset_day: { type: integer, minimum: 1, maximum: 31 }
        timezone: { type: string, description: IANA timezone; default Asia/Shanghai. }
        interface: { type: [string, 'null'], description: Null selects the default-route interface automatically. }
        direction: { type: string, enum: [tx, rx, both] }
        expiry_warning_days: { type: integer, minimum: 0, maximum: 365 }
        traffic_warning_percent: { type: integer, minimum: 1, maximum: 99 }
    NodePackageUsage:
      type: object
      required: [usage_bytes, restricted, reasons, alerts, freshness]
      properties:
        usage_bytes: { type: integer, format: int64 }
        restricted: { type: boolean }
        reasons: { type: array, items: { type: string } }
        next_reset_at: { type: [string, 'null'], format: date-time }
        interface: { type: [string, 'null'] }
        sampled_at: { type: [string, 'null'], format: date-time }
        gap_reason: { type: [string, 'null'] }
        freshness: { type: string, enum: [fresh, stale, not_collected] }
        pending_disconnects: { type: integer }
        failed_disconnects: { type: integer }
        alerts: { type: array, items: { $ref: '#/components/schemas/NodeAlert' } }
    NodeAlert:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [expiring, expired, traffic_warning, quota_exhausted] }
        created_at: { type: string, format: date-time }
    NodeUsageUpdate:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [usage_bytes]
          properties:
            usage_bytes: { type: integer, format: int64, minimum: 0 }
            reset: { type: boolean, description: Start a new alert period; preserves the monthly billing schedule. }
    NodeUsageUpdateResponse:
      type: object
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer }
    NodeCreate:
      type: object
      required:
      - name
      - ssh_host
      - ssh_port
      - ssh_username
      - public_port
      - listen_addr
      - ssh_credential_id
      - ssh_credential_version
      properties:
        dns_allocation:
          $ref: '#/components/schemas/DNSAllocation'
        package:
          $ref: '#/components/schemas/NodePackage'
        initial_usage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Existing provider usage before first network sample.
        name:
          type: string
          maxLength: 100
        ssh_host:
          type: string
        ssh_port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_username:
          type: string
        ssh_host_fingerprint:
          type: string
        public_host:
          type: string
        public_port:
          type: integer
          minimum: 1
          maximum: 65535
        listen_addr:
          type: string
        traffic_stats_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9780
          description: Loopback-only Hysteria trafficStats API port
        proxy_probe_url:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Optional HTTP 200 health target used by the deployment-time proxy
            probe when routing rules block the built-in loopback target
        tls_sni:
          type: string
        tls_skip_verify:
          type: boolean
          default: false
        config:
          type: object
          description: Hysteria options and mtls policy. tls.clientCA is generated by the server and all writes reject it. Managed mode requires manual TLS and an exact currently published CA version.
          properties:
            mtls: { $ref: '#/components/schemas/NodeMTLSSettings' }
          additionalProperties: true
          default: {}
        ssh_credential_id:
          type: string
          format: uuid
        ssh_credential_version:
          type: integer
          minimum: 1
      additionalProperties: false
    NodePatch:
      allOf:
      - $ref: '#/components/schemas/Revision'
      - type: object
        properties:
          package:
            $ref: '#/components/schemas/NodePackage'
          name:
            type: string
          ssh_host:
            type: string
          ssh_port:
            type: integer
            minimum: 1
            maximum: 65535
          ssh_username:
            type: string
          ssh_host_fingerprint:
            type: string
          public_host:
            type: string
          public_port:
            type: integer
            minimum: 1
            maximum: 65535
          listen_addr:
            type: string
          traffic_stats_port:
            type: integer
            minimum: 1
            maximum: 65535
            description: Loopback-only Hysteria trafficStats API port
          proxy_probe_url:
            type: string
            maxLength: 2048
            description: HTTP 200 probe URL reachable through this node's ACL/outbound
              rules; use an empty string to restore the local statistics probe
          tls_sni:
            type: string
          tls_skip_verify:
            type: boolean
          config:
            type: object
            description: Same managed mTLS rules as node creation. Submitting a historical or preparing CA version conflicts; only controlled rollback may use history.
            properties:
              mtls: { $ref: '#/components/schemas/NodeMTLSSettings' }
            additionalProperties: true
          ssh_credential_id:
            type: string
            format: uuid
          ssh_credential_version:
            type: integer
            minimum: 1
        additionalProperties: false
    ResourceCreate:
      type: object
      required:
      - name
      - resource_kind
      - content_base64
      properties:
        name:
          type: string
          maxLength: 180
        resource_kind:
          type: string
          enum:
          - acl
          - geoip
          - geosite
        content_base64:
          type: string
          format: byte
          writeOnly: true
          description: Base64 encoded resource; decoded size is limited to 20 MiB
    UserCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
    UserPatch:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          properties:
            name: { type: string }
            enabled: { type: boolean }
            expires_at: { type: [string, 'null'], format: date-time }
            quota_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
    AuthorizationGroupReference:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
    AuthorizationGroupSource:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AuthorizationGroupSummary:
      type: object
      required: [id, name, revision, user_ids, node_ids, user_count, node_count, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        user_ids:
          type: array
          items: { type: string, format: uuid }
        node_ids:
          type: array
          items: { type: string, format: uuid }
        user_count: { type: integer, minimum: 0 }
        node_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthorizationManagedIdentity:
      type: object
      required: [user_id, ca_credential_id, ca_versions, issue_now, pending]
      properties:
        policy_revision: { type: integer }
        user_id: { type: string }
        ca_credential_id: { type: string }
        ca_versions: { type: array, items: { type: integer } }
        issue_now: { type: boolean }
        pending: { type: boolean }
    AuthorizationIdentityResult:
      type: object
      required: [user_id, ca_credential_id, identity_id, issued, pending]
      properties:
        policy_revision: { type: integer }
        ca_versions: { type: array, items: { type: integer } }
        affected_node_ids: { type: array, items: { type: string } }
        user_id: { type: string }
        ca_credential_id: { type: string }
        identity_id: { type: [string, 'null'] }
        issued: { type: boolean }
        pending: { type: boolean }
    AuthorizationChangePreview:
      type: object
      required: [action, preview_token, additions_count, removals_count, additions, removals, automatic_issue_count, pending_issue_count, managed_identities]
      properties:
        automatic_issue_count: { type: integer, minimum: 0, description: Immediate shared identities to issue, deduplicated by user and CA identity. }
        pending_issue_count: { type: integer, minimum: 0, description: Identities deferred until account access is restored. }
        managed_identities: { type: array, items: { $ref: '#/components/schemas/AuthorizationManagedIdentity' } }
        action: { type: string, enum: [create, update, delete, update_memberships] }
        preview_token: { type: string }
        additions_count: { type: integer, minimum: 0 }
        removals_count: { type: integer, minimum: 0 }
        additions:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationPair' }
        removals:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationPair' }
    AuthorizationCreatedCredential:
      type: object
      required: [user_id, node_id, hy2_credential]
      properties:
        user_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        hy2_credential: { type: string, description: One-time Hysteria credential returned after effective authorization is created. }
    AuthorizationGroupMutationResponse:
      type: object
      required: [group, additions_count, removals_count, created_credentials, revocation_job_ids]
      properties:
        managed_identities: { type: array, items: { $ref: '#/components/schemas/AuthorizationIdentityResult' } }
        group:
          $ref: '#/components/schemas/AuthorizationGroupSummary'
          type: [object, 'null']
        additions_count: { type: integer, minimum: 0 }
        removals_count: { type: integer, minimum: 0 }
        created_credentials:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationCreatedCredential' }
        revocation_job_ids:
          type: array
          items: { type: string, format: uuid }
    NodesPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NodeSummary' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
    NodeMTLSSettings:
      type: object
      additionalProperties: false
      required: [mode]
      description: Defaults to off when omitted. Managed mode requires both CA fields; off rejects both. Only manual TLS supports managed mTLS.
      properties:
        mode: { type: string, enum: ["off", managed] }
        ca_credential_id: { type: string, format: uuid }
        ca_credential_version: { type: integer, minimum: 1 }
    NodeMTLSTrust:
      type: object
      required: [ca_credential_id, ca_credential_version, desired, deployed]
      properties:
        ca_credential_id: { type: string }
        ca_credential_version: { type: integer }
        desired: { type: boolean }
        deployed: { type: boolean }
    NodeMTLSStatus:
      type: object
      required: [target, trust]
      properties:
        target: { $ref: '#/components/schemas/NodeMTLSSettings' }
        deployed:
          $ref: '#/components/schemas/NodeMTLSSettings'
          type: [object, 'null']
        trust: { type: array, items: { $ref: '#/components/schemas/NodeMTLSTrust' } }
    NodeSummary:
      type: object
      required: [id, name, revision, state]
      properties:
        mtls_state: { type: string, enum: [ready, needs_configuration, activating, recovery_required] }
        mtls_recovery_configured: { type: boolean, description: Explicit recovery policy has been saved; recovery deployment may be requested. }
        mtls_error: { type: [string, 'null'] }
        mtls_generation: { type: integer }
        published_connection:
          $ref: '#/components/schemas/PublishedConnection'
          type:
          - object
          - 'null'
        dns_binding:
          $ref: '#/components/schemas/DNSBinding'
          type:
          - object
          - 'null'
        package: { $ref: '#/components/schemas/NodePackage' }
        package_usage: { $ref: '#/components/schemas/NodePackageUsage' }
        id: { type: string, format: uuid }
        name: { type: string }
        ssh: { $ref: '#/components/schemas/NodeSSHDetail' }
        revision: { type: integer }
        deployed_revision: { type: [integer, 'null'] }
        state: { type: string }
        last_sample_at: { type: [string, 'null'], format: date-time }
        data_freshness: { type: string, enum: [fresh, stale, not_collected] }
        mtls_required: { type: boolean }
        open_gaps: { type: integer }
        pending_revocations: { type: integer }
        proxy_probe_url: { type: [string, 'null'], maxLength: 2048 }
    NodeSSHDetail:
      type: object
      required:
      - host
      - port
      - username
      - auth_type
      - credential_id
      - credential_version
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        auth_type:
          type: string
        host_fingerprint:
          type:
          - string
          - 'null'
        credential_id:
          type: string
        credential_version:
          type: integer
    NodeConnectionDetail:
      type: object
      required: [host, port, listen_addr, skip_cert_verify]
      properties:
        host: { type: string }
        port: { type: integer }
        listen_addr: { type: string }
        tls_sni: { type: [string, 'null'] }
        skip_cert_verify: { type: boolean }
    NodeDetail:
      type: object
      required: [id, name, revision, config, yaml_preview, ssh, public, state, created_at, updated_at]
      properties:
        mtls_state: { type: string, enum: [ready, needs_configuration, activating, recovery_required] }
        mtls_recovery_configured: { type: boolean, description: Explicit recovery policy has been saved; recovery deployment may be requested. }
        mtls_error: { type: [string, 'null'] }
        mtls_generation: { type: integer }
        mtls: { $ref: '#/components/schemas/NodeMTLSStatus' }
        published_connection:
          $ref: '#/components/schemas/PublishedConnection'
          type:
          - object
          - 'null'
        dns_binding:
          $ref: '#/components/schemas/DNSBinding'
          type:
          - object
          - 'null'
        package: { $ref: '#/components/schemas/NodePackage' }
        package_usage: { $ref: '#/components/schemas/NodePackageUsage' }
        id: { type: string, format: uuid }
        name: { type: string }
        revision: { type: integer }
        deployed_revision: { type: [integer, 'null'] }
        config: { type: object, additionalProperties: true }
        yaml_preview: { type: string }
        ssh: { $ref: '#/components/schemas/NodeSSHDetail' }
        public: { $ref: '#/components/schemas/NodeConnectionDetail' }
        traffic_stats_port: { type: integer, minimum: 1, maximum: 65535, description: "Loopback-only Hysteria trafficStats API port" }
        state: { type: string }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_sample_at: { type: [string, 'null'], format: date-time }
        data_freshness: { type: string, enum: [fresh, stale, not_collected] }
        open_gaps: { type: integer }
        pending_revocations: { type: integer }
        proxy_probe_url: { type: [string, 'null'], maxLength: 2048 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssignmentInfo:
      type: object
      required:
      - node_id
      - created_at
      properties:
        managed_identity_ids: { type: array, items: { type: string } }
        node_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        source_groups:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationGroupSource' }
    UsersPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
    UserSummary:
      type: object
      required: [id, name, enabled, expires_at, quota_bytes, usage_bytes, revision, quota_reset_at, assignments, created_at, updated_at]
      properties:
        managed_certificates:
          type: array
          items: { $ref: '#/components/schemas/ManagedUserIdentity' }
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64 }
        usage_bytes: { type: integer, format: int64 }
        revision: { type: integer }
        quota_reset_at: { type: [string, 'null'], format: date-time }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AssignmentInfo' }
        authorization_groups:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationGroupReference' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserAuthorizationGroupsMutationResponse:
      type: object
      required: [user_id, revision, group_ids, assignments, created_credentials, revocation_job_ids]
      properties:
        managed_identities: { type: array, items: { $ref: '#/components/schemas/AuthorizationIdentityResult' } }
        user_id: { type: string, format: uuid }
        revision: { type: integer }
        group_ids:
          type: array
          items: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AssignmentInfo' }
        created_credentials:
          type: array
          items: { $ref: '#/components/schemas/AuthorizationCreatedCredential' }
        revocation_job_ids:
          type: array
          items: { type: string, format: uuid }
    JobFingerprintConfirmation:
      type: object
      additionalProperties: false
      required: [expected_revision, fingerprint]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        fingerprint: { type: string }
    JobOutcome:
      type: object
      properties:
        status: { type: string }
        fingerprint: { type: string }
        expected_fingerprint: { type: [string, 'null'] }
        distribution: { type: string }
        version: { type: string }
        architecture: { type: string }
        privilege: { type: string }
        proxy_probe:
          type: [object, 'null']
          properties:
            status: { type: string }
            transport: { type: string }
            route_check: { type: string, enum: [tcp_forwarding, authenticated_session] }
          additionalProperties: true
      additionalProperties: true
    JobResult:
      type: object
      properties:
        stage: { type: string }
        result: { $ref: '#/components/schemas/JobOutcome' }
      additionalProperties: true
    JobsPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
    JobSummary:
      type: object
      required: [id, kind, status, stage, attempts, created_at, updated_at]
      properties:
        resource_type:
          type:
          - string
          - 'null'
        resource_id:
          type:
          - string
          - 'null'
        resource_name:
          type:
          - string
          - 'null'
        id: { type: string, format: uuid }
        kind: { type: string }
        node_id: { type: [string, 'null'], format: uuid }
        node_name:
