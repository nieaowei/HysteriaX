openapi: 3.1.0
info:
  title: HysteriaX Management API
  version: 1.0.0
  description: Versioned API for the HysteriaX management service.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: localhost
security:
  - BearerAuth: []
paths:
  /credentials/ca-identities:
    post:
      operationId: createCAIdentity
      summary: Generate a P-256 CA or import a validated CA chain and matching private key
      description: Signing and chain validation run outside the global write transaction. Repeating the same actor/idempotency key returns the original receipt; changed requests conflict. CA private keys are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CAIdentityCreate' }
      responses:
        '201':
          description: Immutable CA version and initial published generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CAIdentityReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /credentials/{id}/ca-policy:
    patch:
      operationId: updateCAPolicy
      summary: Update client certificate policy using its independent revision
      description: Applies to future issuance and renewal; does not change CA key versions or deploy nodes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CAPolicyUpdate' }
      responses:
        '200':
          description: Updated policy and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CAPolicyReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /credentials/{id}/ca-versions:
    post:
      operationId: publishCAIdentityVersion
      summary: Publish a new CA version through the managed rotation coordinator
      description: Generated CAs accept no imported material. Imported CAs require a replacement chain and matching key. Referenced CAs retain their old published generation until all participating nodes prepare new trust. Unused CAs publish immediately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CAIdentityPublish' }
      responses:
        '202':
          description: Version, batch and optional rotation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CAIdentityReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}/managed-certificates/reissue:
    post:
      operationId: reissueManagedUserCertificates
      summary: Reissue the user's shared identity for one CA or all CAs
      description: Expected revisions are keyed by CA credential ID. Reports every affected authorized node. Paused users retain pending identities. Ordinary reissuance does not disconnect sessions or revoke old certificates.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedUserReissue' }
      responses:
        '200':
          description: Shared identity versions and affected node IDs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserReissueReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /client/summary:
    get:
      operationId: getClientSummary
      summary: Get global user counts and notification candidates without listing directories
      responses:
        '200':
          description: Current counters and only nodes or managed credentials requiring notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSummary' }
  /cache:
    get:
      operationId: getCacheStatistics
      summary: Get bounded cache and shared event-reader statistics
      responses:
        '200':
          description: Aggregate counters without cache keys or payloads
          content:
            application/json:
              schema: { type: object }
  /credentials:
    get:
      operationId: listCredentials
      summary: List managed and business credentials with pagination
      description: "Always returns a page. Defaults to page 1 with 50 items; page_size is limited to 200. Search, filters and sorting apply even when paging parameters are omitted."
      x-swift-include-optional-query: true
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: category, in: query, schema: { type: string, enum: [all, operations, user], default: all } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: include_internal, in: query, description: Include internal node probe identities; hidden by default before pagination., schema: { type: boolean, default: false } }
        - { name: q, in: query, description: Case-insensitive literal substring of the credential name., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, kind, status, created_at], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: "Unified managed and synthetic credential page. Archived/revoked entries remain visible; reference counts and metadata follow the complete catalog. Stable name/ID tie breaking; out-of-range pages are clamped, empty results use page 1."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialsPage' }
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Create a managed credential
      responses:
        '201':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
  /credentials/{id}:
    get:
      operationId: getCredential
      summary: Get credential metadata, versions and references
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetail'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCredential
      summary: Update credential metadata
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPatch'
    delete:
      operationId: deleteCredential
      summary: Delete an unreferenced managed credential
      parameters:
      - name: expected_revision
        in: query
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credentials/{id}/versions:
    post:
      operationId: publishCredentialVersion
      summary: Publish a new immutable credential version
      responses:
        '202':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPublish'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credentials/{id}/references:
    get:
      operationId: getCredentialReferences
      summary: List current and historical credential references
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialReference'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credential-batches/{id}:
    get:
      operationId: getCredentialBatch
      summary: Get credential application batch progress
      responses:
        '200':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBatch'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /credential-batches/{id}/retry:
    post:
      operationId: retryCredentialBatch
      summary: Retry failed credential application targets
      responses:
        '202':
          description: Credential management result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialBatchReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  "/overview":
    get:
      operationId: getOverview
      summary: Read full dashboard summary and actionable issues
      responses:
        '200':
          description: Monitoring overview
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OverviewResponse"
        '400':
          "$ref": "#/components/responses/Error"
  /overview/nodes:
    get:
      operationId: listOverviewNodes
      summary: List node monitoring summaries with search and pagination
      x-swift-include-optional-query: true
      parameters:
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      - { name: q, in: query, schema: { type: string }, description: "Literal case-insensitive search across node names, IDs and public/SSH addresses." }
      responses:
        '200':
          description: Paginated latest node monitoring samples, ordered by name and ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverviewNodesPage' }
        '400':
          $ref: '#/components/responses/Error'
  "/overview/history":
    get:
      operationId: getOverviewHistory
      summary: Read rolling monitoring history (24h, 7d, 30d; legacy today)
      responses:
        '200':
          description: Monitoring overview
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OverviewHistory"
        '400':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
      x-swift-include-optional-query: true
      parameters:
      - { name: metrics, in: query, schema: { type: string, enum: [traffic, quality, all], default: all } }
      - name: range
        description: Rolling elapsed time (24h, 7d, 30d), with hourly or 24-hour buckets anchored at window start. Legacy today uses local midnight.
        in: query
        required: true
        schema:
          type: string
          enum:
          - 24h
          - today
          - 7d
          - 30d
      - name: timezone
        in: query
        required: true
        schema:
          type: string
      - name: node_id
        in: query
        required: false
        schema:
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - users
          - network
  /nodes:
    get:
      operationId: listNodes
      summary: List nodes
      description: "Always returns a page. Defaults to page 1 with 50 items; page_size is limited to 200. Search, filters and sorting apply even when paging parameters are omitted."
      x-swift-include-optional-query: true
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: q, in: query, description: "Literal case-insensitive substring across node names, SSH hosts, IDs and states.", schema: { type: string } }
        - { name: state_matches, in: query, description: "Comma-separated raw states whose localized labels match q; ORed with substring search.", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, ssh_host, state, created_at], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: "Node page with stable name/ID tie breaking, full summary fields and live telemetry. Out-of-range pages are clamped; empty results use page 1."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodesPage' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createNode
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCreate' }
      responses:
        '201':
          description: Created node and one-time node token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEntity' }
        '400': { $ref: '#/components/responses/Error' }
  /nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getNode
      summary: Get node
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateNode
      summary: Update node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePatch' }
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeUpdateResponse' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteNode
      summary: Delete node and queue managed remote uninstall
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Queued remote uninstall job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/record:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: removeNodeRecord
      summary: Remove only the management record without SSH or remote uninstall
      description: Removes node assignments, configuration and pending revocations, cancels queued and cancellable running jobs, and retains job history and audit. The remote service may remain running. Conflicts while a remote deployment, uninstall or credential update is running; wait for that operation to finish. Requires the node_record_removal feature.
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Management record removed; remote uninstall was not performed }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateNodeUsage
      summary: Correct or reset whole-host package usage without deploying the node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeUsageUpdate' }
      responses:
        '200':
          description: Updated usage and node revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeUsageUpdateResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/ssh-test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: testNodeSSH
      summary: Test node SSH
      description: Allowed for delete_failed nodes to diagnose and confirm fingerprints while preserving deletion intent. Active deletion still rejects new tests. A successful recovery test does not automatically retry uninstall.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued SSH test job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/deploy:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: deployNode
      summary: Deploy node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued deployment job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: syncNode
      summary: Sync node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued synchronization job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/rollback:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rollbackNode
      summary: Rollback node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Queued rollback job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listNodeResources
      summary: List node resources
      responses:
        '200':
          description: Resource metadata without resource contents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeResource' }
    post:
      operationId: uploadNodeResource
      summary: Upload a node resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCreate' }
      responses:
        '201':
          description: Created encrypted resource and reference URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceReceipt' }
        '400': { $ref: '#/components/responses/Error' }
  /nodes/{id}/resources/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: resource_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteNodeResource
      summary: Delete an unreferenced node resource
      responses:
        '204': { description: Deleted resource }
        '409': { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listUsers
      summary: List users
      description: "Always returns a page. Defaults to page 1 with 50 items; page_size is limited to 200. Search, filters and sorting apply even when paging parameters are omitted."
      x-swift-include-optional-query: true
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: q, in: query, description: "Literal case-insensitive substring across user names, user IDs and assigned node IDs.", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: "User page with stable name/ID ordering and full authorization metadata. Out-of-range pages are clamped to the last page; empty results use page 1."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsersPage' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEntity' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUser
      summary: Get user
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
    patch:
      operationId: updateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserUpdateResponse' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteUser
      summary: Delete user
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted }
  /users/{id}/authorization-groups/preview:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: previewUserAuthorizationGroups
      summary: Preview a user's authorization-group membership change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthorizationGroupsPreview' }
      responses:
        '200':
          description: Membership change preview, including effective assignment deltas and missing mTLS bindings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationChangePreview' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}/authorization-groups:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateUserAuthorizationGroups
      summary: Replace a user's authorization-group memberships
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthorizationGroupsUpdate' }
      responses:
        '200':
          description: Updated memberships, effective assignments, one-time credentials, and queued revocations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuthorizationGroupsMutationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /authorization-groups/preview:
    post:
      operationId: previewAuthorizationGroupCreate
      summary: Preview authorization-group creation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationGroupPreview' }
      responses:
        '200':
          description: Creation preview, including effective assignment deltas and missing mTLS bindings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationChangePreview' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /authorization-groups:
    get:
      operationId: listAuthorizationGroups
      summary: List authorization groups
      responses:
        '200':
          description: Authorization groups with their member and node sets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthorizationGroupSummary' }
    post:
      operationId: createAuthorizationGroup
      summary: Create an authorization group from a validated preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationGroupCreate' }
      responses:
        '201':
          description: Created group, one-time credentials, and queued revocations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationGroupMutationResponse' }
