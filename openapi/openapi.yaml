          in: header
          description: Client kernel and version; unknown versions use conservative capabilities.
          schema: { type: string }
      servers:
        - url: https://{domain}
          variables:
            domain: { default: localhost }
      security: []
      responses:
        '200':
          description: Subscription file or static format selection page
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string, const: User-Agent } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Robots-Tag: { schema: { type: string, const: 'noindex, nofollow' } }
            X-HysteriaX-Filtered-Nodes:
              description: Number of incompatible nodes omitted from a subscription file.
              schema: { type: integer, minimum: 0 }
          content:
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
            text/html: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
