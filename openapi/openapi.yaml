  /jobs/{id}/confirm-fingerprint:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: confirmJobFingerprint
      summary: Trust the observed SSH host key and resume the same operation
      description: Supports SSH tests and first-time trust during deploy, sync and rollback. Requires waiting_confirmation, the exact observed fingerprint and the unchanged node revision. Saves trust and queues the original job atomically. Rollback preserves its historical target; deploy/sync advance a current target only over the identical trust-only snapshot. SSH tests may recover delete_failed nodes without clearing deletion intent. A fresh connection verifies the key before authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobFingerprintConfirmation' }
      responses:
        '202':
          description: Original operation queued to continue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: retryJob
      summary: Retry a failed job with an explicit link to its prior attempt
      description: Supports SSH test, deployment/sync, rollback and pending kick requests. Kick executions are bounded to five attempts; transport failures retain a durable request resumed after trusted SSH recovery, while other exhausted or permanent failures require explicit retry. Active duplicate requests return the same retry. Retry success resolves only the linked failure reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '202':
          description: Linked retry queued or already active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
