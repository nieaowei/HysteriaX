        user_id: { type: string, format: uuid }
        revision: { type: integer }
        credentials:
          type: array
          items: { $ref: '#/components/schemas/RotatedCredential' }
        note: { type: string }
    JobReceipt:
      type: object
      required: [job_id, status]
      properties:
