        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        quota_bytes: { type: [integer, 'null'], format: int64 }
        revision: { type: integer }
    QuotaResetResponse:
      type: object
      required: [user_id, usage_bytes, quota_reset_at, revision]
      properties:
        user_id: { type: string, format: uuid }
        usage_bytes: { type: integer, format: int64 }
        quota_reset_at: { type: string, format: date-time }
        revision: { type: integer }
    ActiveSubscription:
      type: object
      required: [id, token, url, created_at]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Current subscription token. }
        url: { type: string }
        auto_url: { type: string, description: Automatic subscription URL; optional for compatibility with older servers. }
        created_at: { type: string, format: date-time }
    SubscriptionStatus:
      type: object
      required: [user_id, revision]
      properties:
        user_id: { type: string, format: uuid }
        revision: { type: integer }
        active: { $ref: '#/components/schemas/ActiveSubscription' }
    NodeUsageSummary:
      type: object
      required: [node_id, tx_bytes, rx_bytes, sampled_at]
      properties:
        node_id: { type: string, format: uuid }
        tx_bytes: { type: integer, format: int64 }
        rx_bytes: { type: integer, format: int64 }
        sampled_at: { type: [string, 'null'], format: date-time }
        assigned: { type: boolean }
    DataFreshness:
      type: object
      required: [status, last_sample_at, open_gaps]
      properties:
        status: { type: string }
        last_sample_at: { type: [string, 'null'], format: date-time }
        open_gaps: { type: integer }
    PendingRevocation:
      type: object
      required: [job_id, node_id, status, stage, updated_at]
      properties:
        job_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, failed] }
        stage: { type: string }
        updated_at: { type: string, format: date-time }
    UserUsageResponse:
      type: object
      required: [user_id, name, usage_bytes, quota_bytes, quota_reset_at, by_node, data_freshness]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        usage_bytes: { type: integer, format: int64 }
        quota_bytes: { type: [integer, 'null'], format: int64 }
        quota_reset_at: { type: [string, 'null'], format: date-time }
        by_node:
          type: array
          items: { $ref: '#/components/schemas/NodeUsageSummary' }
        data_freshness: { $ref: '#/components/schemas/DataFreshness' }
        pending_revocations:
          type: array
          items: { $ref: '#/components/schemas/PendingRevocation' }
    JobDetailResponse:
      type: object
      required: [job, result, logs, started_at]
      properties:
        job: { $ref: '#/components/schemas/JobSummary' }
        result: { type: [object, 'null'], additionalProperties: true }
        logs:
          type: array
          items: { type: object, additionalProperties: true }
        started_at: { type: [string, 'null'], format: date-time }
    HysteriaAuthResponse:
      type: object
      required: [ok, id]
      properties:
        ok: { type: boolean }
        id: { type: string }
    CreatedEntity:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        node_auth_token: { type: string, description: One-time node authentication token. }
        node: { $ref: '#/components/schemas/NodeReceipt' }
      additionalProperties: true
    NodeReceipt:
      type: object
      required: [id, name, revision, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        revision: { type: integer }
        state: { type: string }
        traffic_stats_port: { type: integer, minimum: 1, maximum: 65535 }
    ServerMonitoring:
      type: object
      required: [service_version, service_uptime_seconds, database, sampled_at, hostname, os, host_uptime_seconds, cpu_count, cpu_usage_percent, memory_used_bytes, memory_total_bytes, root_disk_used_bytes, root_disk_total_bytes]
      properties:
        service_version: { type: string }
        service_uptime_seconds: { type: integer, minimum: 0 }
        database: { type: string, enum: [ok, unavailable] }
        sampled_at: { type: string, format: date-time }
        hostname: { type: [string, 'null'] }
        os: { type: [string, 'null'] }
        host_uptime_seconds: { type: integer, minimum: 0 }
        cpu_count: { type: integer, minimum: 0 }
        cpu_usage_percent: { type: number, minimum: 0, maximum: 100 }
        memory_used_bytes: { type: integer, minimum: 0 }
        memory_total_bytes: { type: integer, minimum: 0 }
        root_disk_used_bytes: { type: [integer, 'null'], minimum: 0 }
        root_disk_total_bytes: { type: [integer, 'null'], minimum: 0 }
    APIHealth:
      type: object
      required: [status]
      properties:
        status: { type: string }
        database: { type: string }
    APIVersion:
      type: object
      required: [api_version, service_version, hysteria_version, mihomo_version]
      properties:
        current_admin_token_id: { type: string }
        features: { type: array, items: { type: string }, description: Optional supported features; node_packages enables node package writes. }
        api_version: { type: string }
        service_version: { type: string }
        hysteria_version: { type: string }
        mihomo_version: { type: string }
    APIErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    APIErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/APIErrorDetail' }
    AdminTokenSummary:
      type: object
      required: [id, label, created_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
