name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: hysteriax_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hysteriax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hysteriax_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-test.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/verify-subscription.sh
      - run: scripts/verify-realm-live.py
      - run: scripts/verify-migrations.py
      - run: scripts/verify-restart-recovery.py
      - run: scripts/verify-sampling-failure.py
      - run: scripts/verify-auth-isolation.py
      - run: python3 -m unittest discover -s tests -p 'test_backup_restore.py'
      - run: scripts/verify-backup-restore-compose.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ruby scripts/generate-swift-api-models.rb --check
      - run: scripts/verify-subscription-client.sh
      - run: scripts/verify-node-package-client.sh
      - run: scripts/verify-acme-dns-client.sh
      - run: npx --yes @redocly/cli@2.55.0 lint --config redocly.yaml openapi/openapi.yaml
      - run: xcodebuild -project apps/macos/HysteriaX.xcodeproj -scheme HysteriaX -configuration Release -sdk macosx -destination 'generic/platform=macOS' -derivedDataPath apps/macos/.build/ci build CODE_SIGNING_ALLOWED=NO
      - run: scripts/verify-macos-app.sh apps/macos/.build/ci/Build/Products/Release/HysteriaX.app
      - run: scripts/verify-mihomo-config.sh tests/fixtures/mihomo-hysteria2.yaml
