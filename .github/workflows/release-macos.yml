name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Package the unsigned universal app
        run: scripts/release-macos.sh
        env:
          HYSTERIAX_RELEASE_VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: HysteriaX-${{ github.ref_name }}-macOS-universal
          path: dist/HysteriaX-*-macOS-universal.dmg
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/HysteriaX-*-macOS-universal.dmg
