name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notarize-and-publish:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Sign, notarize, and package the universal app
        run: scripts/release-macos.sh
        env:
          HYSTERIAX_RELEASE_VERSION: ${{ github.ref_name }}
          HYSTERIAX_DEVELOPER_ID_P12_BASE64: ${{ secrets.HYSTERIAX_DEVELOPER_ID_P12_BASE64 }}
          HYSTERIAX_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.HYSTERIAX_DEVELOPER_ID_P12_PASSWORD }}
          HYSTERIAX_APPLE_TEAM_ID: ${{ secrets.HYSTERIAX_APPLE_TEAM_ID }}
          HYSTERIAX_NOTARY_KEY_ID: ${{ secrets.HYSTERIAX_NOTARY_KEY_ID }}
          HYSTERIAX_NOTARY_ISSUER_ID: ${{ secrets.HYSTERIAX_NOTARY_ISSUER_ID }}
          HYSTERIAX_NOTARY_KEY_P8_BASE64: ${{ secrets.HYSTERIAX_NOTARY_KEY_P8_BASE64 }}

      - uses: actions/upload-artifact@v4
        with:
          name: HysteriaX-${{ github.ref_name }}-macOS-universal
          path: dist/HysteriaX-*-macOS-universal.dmg
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/HysteriaX-*-macOS-universal.dmg
