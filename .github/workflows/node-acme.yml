name: Node ACME
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acme:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: components/hysteriax-acme/go.sum
      - run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: PEBBLE_BIN="$(go env GOPATH)/bin/pebble" go test -race ./...
        working-directory: components/hysteriax-acme
      - run: go vet ./...
        working-directory: components/hysteriax-acme
      - run: scripts/build-node-acme.sh
      - run: docker build -f scripts/fixtures/systemd-node.Dockerfile -t hysteriax-acme-test-node:0003 .
      - run: PEBBLE_NODE_BIN="$(go env GOPATH)/bin/pebble" scripts/verify-node-acme-systemd.py
