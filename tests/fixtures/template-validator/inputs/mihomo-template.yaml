mixed-port: 7888
redir-port: 7892
allow-lan: true
bind-address: '*'
find-process-mode: strict
mode: rule
ipv6: true
log-level: silent
global-client-fingerprint: chrome
dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:5450
  enhanced-mode: fake-ip
  fake-ip-range: 198.19.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - 1.0.0.1
    - 208.67.222.222
    - 1.2.4.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query
    - tls://dns.adguard.com:853
  fallback:
    - tls://223.5.5.5:853
    - https://223.5.5.5/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
proxies: []
proxy-groups:
  - name: SELECT
    type: select
    proxies: []
  - name: PROXY
    type: select
    proxies:
      - SELECT
  - name: IPFake
    type: select
    proxies:
      - PROXY
      - DIRECT
rule-providers:
  cncidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/cncidr.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/lancidr.yaml
    interval: 86400
  reject:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    path: ./ruleset/google.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./ruleset/direct.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt
    path: ./ruleset/icloud.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/proxy.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/applications.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/gfw.yaml
    interval: 86400
  IPfake:
    type: http
    behavior: classical
    url: https://raw.fastgit.org/lwd-temp/anti-ip-attribution/main/generated/rule-provider.yaml
    path: ./Rules/IPfake.yaml
    interval: 259200
  private:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/private.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
    path: ./ruleset/apple.yaml
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400
rules:
  - DOMAIN-SUFFIX,ordinals.com,PROXY
  - DOMAIN-SUFFIX,oklink.com,PROXY
  - DOMAIN-SUFFIX,appstorrent.ru,PROXY
  - DOMAIN-SUFFIX,vlike.work,PROXY
  - DOMAIN-SUFFIX,k8slens.dev,PROXY
  - DOMAIN-SUFFIX,binance.com,PROXY
  - DOMAIN-KEYWORD,xtoys.app,PROXY
  - DOMAIN-SUFFIX,kubernetes.io,PROXY
  - DOMAIN-SUFFIX,hikit.io,DIRECT
  - DOMAIN-KEYWORD,apple.com,DIRECT
  - DOMAIN-SUFFIX,mask-api.icloud.com,PROXY
  - DOMAIN-SUFFIX,mask-api.fe.apple-dns.net,PROXY
  - DOMAIN-SUFFIX,mask.icloud.com,PROXY
  - DOMAIN-SUFFIX,mask.apple-dns.net,PROXY
  - DOMAIN-SUFFIX,mask-h2.icloud.com,PROXY
  - DOMAIN-SUFFIX,mask-t.apple-dns.net,PROXY
  - RULE-SET,IPfake,IPFake
  - RULE-SET,apple,DIRECT
  - RULE-SET,applications,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,gfw,PROXY
  - RULE-SET,google,PROXY
  - RULE-SET,icloud,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,proxy,PROXY
  - RULE-SET,reject,REJECT
  - RULE-SET,telegramcidr,PROXY
  - RULE-SET,tld-not-cn,PROXY
  - MATCH,PROXY
